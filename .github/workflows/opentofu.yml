name: "OpenTofu Deploy"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  opentofu:
    name: "Infrastructure & Deployment"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.8.2

    - name: OpenTofu Init
      run: tofu init
      working-directory: ./terraform

    # NEW IMPORT STEP: This stops the "already exists" error by importing the existing project
    - name: OpenTofu Import (If exists)
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu import cloudflare_pages_project.portfolio_site ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/tf-cf-portfolio || true
      working-directory: ./terraform

    # This will now see the project is tracked and skip creating it again
    - name: OpenTofu Apply
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu apply -auto-approve
      working-directory: ./terraform

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy src --project-name=tf-cf-portfolio --branch=main

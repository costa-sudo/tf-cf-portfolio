name: "OpenTofu Deploy"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "terraform/**"
      - ".github/workflows/opentofu.yml"

permissions:
  contents: read

jobs:
  opentofu:
    name: "Infrastructure & Deployment"
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_name: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      TF_VAR_custom_domain: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate deployment configuration
      env:
        CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      run: |
        test -n "$CLOUDFLARE_PAGES_PROJECT_NAME" || { echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"; exit 1; }
        test -n "$CLOUDFLARE_CUSTOM_DOMAIN" || { echo "Missing repository variable: CLOUDFLARE_CUSTOM_DOMAIN"; exit 1; }

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.8.2

    - name: OpenTofu Init
      run: tofu init
      working-directory: ./terraform

    # Imports your project layout safely if running for the first time
    - name: OpenTofu Import Project (If exists)
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu import cloudflare_pages_project.portfolio_site "$TF_VAR_cloudflare_account_id/$TF_VAR_project_name" || true
      working-directory: ./terraform

    # Imports your domain mapping safely if running for the first time
    - name: OpenTofu Import Domain (If exists)
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu import cloudflare_pages_domain.portfolio_custom_domain "$TF_VAR_cloudflare_account_id/$TF_VAR_project_name/$TF_VAR_custom_domain" || true
      working-directory: ./terraform

    # Infrastructure changes are locked down and ONLY execute on the main branch
    - name: OpenTofu Apply
      if: github.ref_name == 'main'
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu apply -auto-approve
      working-directory: ./terraform

    # Install Wrangler natively onto the runner machine to bypass marketplace wrapper bugs
    - name: Install Cloudflare Wrangler
      run: npm install -g wrangler

    # Deploy production to the main branch and preview to the dev branch.
    - name: Deploy to Cloudflare Pages (Production)
      if: github.ref_name == 'main'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: wrangler pages deploy src --project-name="$TF_VAR_project_name" --branch=main

    - name: Deploy to Cloudflare Pages (Preview)
      if: github.ref_name == 'dev'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: wrangler pages deploy src --project-name="$TF_VAR_project_name" --branch=dev

name: "Production-Grade Deploy"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "terraform/**"
      - ".github/workflows/opentofu.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write # Required if you want to comment tofu plans on PRs

jobs:
  validate-and-plan:
    name: "OpenTofu Validate & Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.2

      - name: OpenTofu Fmt & Validate
        run: |
          tofu fmt -check
          tofu init -backend=false
          tofu validate

      # Optional: If using a remote backend (like Cloudflare R2 / S3), initialize and run plan on PRs
      - name: OpenTofu Plan
        if: github.event_name == 'pull_request'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_project_name: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          TF_VAR_custom_domain: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
        run: tofu plan

  apply-infrastructure:
    name: "Apply Infrastructure (Main)"
    needs: validate-and-plan
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    env:
      TF_VAR_project_name: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      TF_VAR_custom_domain: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.2

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Apply
        run: tofu apply -auto-approve

  deploy-application:
    name: "Deploy to Cloudflare Pages"
    needs: apply-infrastructure
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Pinned Wrangler CLI
        run: npm install -g wrangler@3.114.0

      - name: Deploy Production (Main Branch)
        if: github.ref_name == 'main'
        run: wrangler pages deploy src --project-name="$PROJECT_NAME" --branch=main

      - name: Deploy Preview (Dev Branch)
        if: github.ref_name == 'dev'
        run: wrangler pages deploy src --project-name="$PROJECT_NAME" --branch=dev

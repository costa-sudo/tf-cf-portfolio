name: "OpenTofu Deploy"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  opentofu:
    name: "Infrastructure & Deployment"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.8.2

    - name: OpenTofu Init
      run: tofu init
      working-directory: ./terraform

    # Imports your project layout safely if running for the first time
    - name: OpenTofu Import Project (If exists)
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu import cloudflare_pages_project.portfolio_site ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/tf-cf-portfolio || true
      working-directory: ./terraform

    # Imports your domain mapping safely if running for the first time
    - name: OpenTofu Import Domain (If exists)
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu import "cloudflare_pages_domain.portfolio_custom_domain" ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/tf-cf-portfolio/costajp.com || true
      working-directory: ./terraform

    # Infrastructure changes execute cleanly on the main branch
    - name: OpenTofu Apply
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: tofu apply -auto-approve
      working-directory: ./terraform

    # Install Wrangler natively onto the runner machine to bypass marketplace wrapper bugs
    - name: Install Cloudflare Wrangler
      run: npm install -g wrangler

    # Deploy code natively using the main branch parameter directly
    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: wrangler pages deploy src --project-name=tf-cf-portfolio --branch=main
